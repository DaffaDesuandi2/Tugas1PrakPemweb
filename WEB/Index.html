<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Manajemen Tugas Mahasiswa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

</head>
<body  class="bg-white-100 flex min-h-screen">
    <div id="sidebar" class="bg-gray-100 text-black w-64 p-4 flex flex-col transition-all duration-300">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-semibold">📚 Menu</h2>
            <button id="closeSidebar" class="p-2 hover:bg-gray-300 rounded">
            <i data-lucide="panel-left-close" class="w-6 h-6"></i>
            </button>
        </div>
        <div class="mb-4">
            <input type="text" id="searchTaskInput" placeholder="Cari Tugas (Nama/Deadline)" class="w-full p-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500 mb-2">
            <select id="filterStatusDropdown" class="w-full p-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500">
                <option value="all">Semua Status</option>
                <option value="pending">Belum Selesai</option>
                <option value="done">Selesai</option>
            </select>
        </div>
        <button id="addCourse" class="bg-gray-300 px-3 py-3 rounded mb-5 hover:bg-gray-200 text-lg font-semibold">+</button>
        <div id="courseList" class="flex flex-col gap-2"></div>
        <button id="addCourse" class="bg-gray-300 px-3 py-3 rounded mb-5 hover:bg-gray-200 text-lg font-semibold">+</button>
        <div id="courseList" class="flex flex-col gap-2"></div>
        
    </div>

    <main id="taskContainer" class="flex-grow p-8 bg-white overflow-y-auto">
        <h1 id="mainTitle" class="text-3xl font-bold text-gray-800 mb-6">Pilih Mata Kuliah di Menu Samping</h1>
        <div id="taskContent" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
        
        <button id="addTaskBtn" class="bg-blue-500 text-white px-4 py-2 rounded shadow-md hover:bg-blue-600 transition duration-150 mt-8 hidden">
            <i data-lucide="plus" class="w-5 h-5 inline-block mr-2"></i>
            Tambah Tugas Baru
        </button>
    </main>
    <div>
        <button id="openSidebar" class="p-2 bg-gray-300 rounded absolute top-4 left-4 hidden z-10 hover:bg-gray-200">
        <i data-lucide="panel-left-open" class="w-6 h-6"></i>
        </button>
    </div>
    
   <script src ="Script.js"></script> 
</body>
</html>
